name: visual_diff
description: >-
  Visual regression diffing engine, snapshot runner, and Argos-inspired
  interactive review UI built with Dart and Jaspr.
publish_to: none

resolution: workspace
environment:
  sdk: ^3.14.0-0

dependencies:
  collection: ^1.19.1
  image: ^4.12.0
  jaspr: ^0.24.0-beta.1
  meta: ^1.19.0
  path: ^1.9.1
  puppeteer: ^3.28.0
  universal_web: ^1.1.1+2

dev_dependencies:
  analysis_defaults:
    path: ../analysis_defaults
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.12
  jaspr_builder: ^0.24.0-beta.1
  test: ^1.31.1

jaspr:
  mode: client
