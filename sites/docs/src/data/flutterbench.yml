cuj_example:
  - label: "User"
    icon: "person"
    variant: "grey"
    items:
      - "As an application developer"
  - label: "Goal"
    icon: "star"
    variant: "blue"
    items:
      - "I want to resolve layout overflow errors in UI component trees"
  - label: "Tasks"
    icon: "apps"
    variant: "purple"
    items:
      - "I use the error messaging to identify widgets causing the layout overflow in the widget tree."
      - "I refactor the layout using flexible scrolling or bounding widgets to resolve the overflow error."
      - "Implement widget tests to prevent regressions."

task_specifications:
  - id: "structure"
    title: "Task Structure"
    icon: "schema"
    expanded: true
    description: "Directory layout, instructions, environments, and verification criteria."
    lead_text: "Each task lives in its own directory and contains four elements:"
    tables:
      - headers: ["Element", "Description"]
        rows:
          - label: "Instruction"
            description: "A realistic prompt written the way developers talk to agents (typically 1–2 sentences, behavior-focused rather than prescriptive)."
          - label: "Target codebase & environment"
            description: "A containerized Docker environment preseeded with a Dart or Flutter codebase, testing greenfield generation or existing codebases with bugs or debt."
          - label: "Verification criteria"
            description: "Verification scripts (`tests/graders.dart` and `test.sh`) executing `package:eval_scoring`."
          - label: "Configuration & metadata"
            description: "The `task.toml` configuration defining associated CUJs, priority tiers, expected skills, and MCP tools."
  - id: "categories"
    title: "Task Categories"
    icon: "category"
    expanded: false
    description: "Primary agent capabilities and workflows evaluated across benchmarks."
    lead_text: "Tasks are categorized by the primary agent capability being evaluated:"
    tables:
      - headers: ["Category", "Description"]
        rows:
          - label: "Greenfield generation"
            description: "Creating new features or applications from scratch."
          - label: "Hill climbing"
            description: "Iterative debugging, test repair, and multi-turn problem-solving."
          - label: "Refactoring"
            description: "Restructuring existing code while maintaining functionality."
          - label: "Migration"
            description: "Upgrading deprecated APIs or transitioning between architectural patterns."
          - label: "Integration"
            description: "Adding platform-specific features, native plugins, or third-party packages."
  - id: "tiers"
    title: "Task Tiers & Prioritization"
    icon: "layers"
    expanded: false
    description: "Execution cadences and priority levels balancing coverage and speed."
    lead_text: "To balance comprehensive coverage with evaluation speed, tasks are organized into execution tiers and priorities:"
    tables:
      - title: "Execution tiers"
        headers: ["Tier", "Description"]
        rows:
          - label: "Tier 1"
            description: "Core benchmark tasks executed monthly across the complete evaluation matrix."
          - label: "Tier 2"
            description: "Maturing tasks slated to graduate into Tier 1 once calibrated."
          - label: "Tier 3"
            description: "Experimental tasks used for ad-hoc investigations and targeted questions."
      - title: "Task priority"
        headers: ["Priority", "Description"]
        rows:
          - label: "P0"
            description: "Critical production workflows and high-frequency productivity tasks"
          - label: "P1"
            description: "Core functionality and API consistency verification"
          - label: "P2"
            description: "Standard features and application maturity tasks"
          - label: "P3"
            description: "Edge cases and cosmetic polish"
  - id: "qa"
    title: "Quality Assurance"
    icon: "verified"
    expanded: false
    description: "Engineering audits and human reviewer calibration for dataset integrity."
    lead_text: "Before a task graduates into the core benchmark suite, it undergoes an engineering audit. Human reviewers inspect initial trial runs and label results as:"
    tables:
      - headers: ["Audit label", "Definition"]
        rows:
          - label: "True positive"
            description: "Agent correctly passed the task."
          - label: "True negative"
            description: "Agent correctly failed the task."
          - label: "False positive"
            description: "Agent passed incorrectly due to overly lenient checks."
          - label: "False negative"
            description: "Agent failed incorrectly due to brittle or flaky tests."
    footer_text: "This process ensures that the dataset produces reliable, actionable signals rather than noise."

evaluation_matrix:
  title: "4-Axis Evaluation Matrix"
  description: "Select an evaluation axis to explore its configurations, supported targets, and methodology."
  axes:
    - id: "configurations"
      tab_label: "1. Configurations"
      tab_sublabel: "Tooling Modes"
      heading: "Axis 1: Tooling Configurations"
      badge: "3 Setups"
      variant: "functional"
      overview: "FlutterBench tests three configurations to isolate the impact of specialized Dart and Flutter AI tools (skills, MCP tools, compiler diagnostics, and sandboxes)."
      items_label: "Configurations Tested:"
      items:
        - label: "Baseline"
          detail: "No specialized Dart or Flutter tools loaded — tests raw model capability and baseline reasoning."
        - label: "Enhanced"
          detail: "Full suite of Dart and Flutter skills, MCP server tools, and compiler diagnostics loaded."
        - label: "Enhanced Minus N"
          detail: "Full suite with a specific tool or skill group ablated to measure its isolated delta."
      footer_text: "This A/B testing approach isolates whether adding specific tools (such as widget inspection or analyzer fixes) measurably improves task success rates."

    - id: "models"
      tab_label: "2. Frontier Models"
      tab_sublabel: "Model Families"
      heading: "Axis 2: Frontier Model Families"
      badge: "3 Families"
      variant: "quality"
      overview: "Evaluations span major frontier model families across high-capability reasoning tiers and low-latency production tiers."
      items_label: "Model Families Evaluated:"
      items:
        - label: "Gemini"
          detail: "Evaluated across Gemini Pro (deep reasoning and complex architecture) and Gemini Flash (low-latency generation) tiers."
        - label: "Claude"
          detail: "Evaluated across Claude Opus (heavy multi-file refactoring) and Claude Sonnet (daily developer workflows)."
        - label: "ChatGPT"
          detail: "Evaluated across the GPT-4o series and specialized reasoning checkpoints."
      footer_text: "Additional providers and local open-weights models are integrated continuously based on community feedback and developer adoption."

    - id: "harnesses"
      tab_label: "3. Agent Harnesses"
      tab_sublabel: "CLI Runtimes"
      heading: "Axis 3: Agent Runtime Harnesses"
      badge: "2 Harnesses"
      variant: "dx"
      overview: "Different agents employ distinct system prompts, context management techniques, and tool-loading strategies. We evaluate the CLI agents Flutter developers use most."
      items_label: "Agent Harnesses Tested:"
      items:
        - label: "Antigravity CLI"
          detail: "Google's developer agent harness featuring optimized tool discovery, compact context budgets, and deep IDE integration."
        - label: "Claude Code"
          detail: "Anthropic's terminal-based agent harness with autonomous multi-turn problem-solving capabilities."
      footer_text: "Testing across multiple harnesses isolates model intelligence from agent runtime orchestration, measuring how execution environments influence success."

    - id: "sdks"
      tab_label: "4. SDK Branches"
      tab_sublabel: "Release Channels"
      heading: "Axis 4: SDK Release Channels"
      badge: "2 Channels"
      variant: "perfect"
      overview: "Evaluations run against both Flutter release channels to verify developer-ready reliability and detect framework regressions early."
      items_label: "Release Channels Tracked:"
      items:
        - label: "Stable"
          detail: "The current production SDK release — measures developer-ready reliability on the version used by most teams."
        - label: "Beta"
          detail: "Monthly beta releases — catches deprecation migrations, API evolutions, and analyzer changes before stable rollout."
      footer_text: "Ensures AI tooling and skills maintain precision as the Flutter framework and Dart language evolve."

dimensions:
  - title: "1. Outcome"
    icon: "check_circle"
    category: "outcome"
    description: "Evaluates whether the generated code compiles, runs, and fulfills all functional UI and task requirements correctly."
    footer_items: "Build, Tests, Visual, Heuristics"
    badge: "Functional"
  - title: "2. Code Quality"
    icon: "code"
    category: "quality"
    description: "Measures code maintainability, static analysis lints, architectural health, and idiomatic Dart 3 standards."
    footer_items: "Lints, DCM, Structure, Patterns"
    badge: "Maintainable"
  - title: "3. Developer Experience"
    icon: "bolt"
    category: "dx"
    description: "Tracks agent execution friction, tool call accuracy, error recovery loops, and step efficiency."
    footer_items: "Tooling, Trajectory, Recovery"
    badge: "Efficiency"

grader_matrix:
  title: "Grader Matrix"
  description: "Explore deterministic, LLM-as-a-judge, and heuristic evaluation graders."
  filters:
    - id: "all"
      label: "All Graders"
    - id: "outcome"
      label: "Outcome"
    - id: "quality"
      label: "Quality"
    - id: "dx"
      label: "DX"
  graders:
    - name: "Build & Run"
      category: "outcome"
      category_label: "Outcome"
      type: "deterministic"
      type_label: "Deterministic"
      description: "Binary pass/fail checking if code compiles and launches cleanly."
    - name: "Unit & Widget Testing"
      category: "outcome"
      category_label: "Outcome"
      type: "deterministic"
      type_label: "Deterministic"
      description: "Executes test suites and scores passing test ratio across affected code."
    - name: "Visual Validation"
      category: "outcome"
      category_label: "Outcome"
      type: "llm"
      type_label: "LLM-as-Judge"
      description: "Compares DevTools screenshot captures against visual UI expectations."
    - name: "Task Heuristics"
      category: "outcome"
      category_label: "Outcome"
      type: "heuristic"
      type_label: "Heuristic"
      description: "Task-specific checks verifying dependency additions, required config, and files."
    - name: "Static Analysis"
      category: "quality"
      category_label: "Quality"
      type: "deterministic"
      type_label: "Deterministic"
      description: "Runs `dart analyze` enforcing strict project lint rules."
    - name: "Dart Code Metrics (DCM)"
      category: "quality"
      category_label: "Quality"
      type: "deterministic"
      type_label: "Deterministic"
      description: "Detects dead code, widget complexity, undisposed controllers, and memory leaks."
    - name: "Idiomatic Dart Review"
      category: "quality"
      category_label: "Quality"
      type: "llm"
      type_label: "LLM-as-Judge"
      description: "Evaluates modern Dart 3 pattern compliance and adherence to Effective Dart."
    - name: "Structural Validation"
      category: "quality"
      category_label: "Quality"
      type: "deterministic"
      type_label: "Deterministic"
      description: "Verifies directory structure, naming conventions, and required file placement."
    - name: "Tool Usage Analysis"
      category: "dx"
      category_label: "DX"
      type: "deterministic"
      type_label: "Deterministic"
      description: "Checks whether appropriate MCP tools and CLI utilities were called effectively."
    - name: "Step & Token Economy"
      category: "dx"
      category_label: "DX"
      type: "deterministic"
      type_label: "Deterministic"
      description: "Measures trajectory length, token burn, and redundant execution steps."
    - name: "Error Recovery"
      category: "dx"
      category_label: "DX"
      type: "llm"
      type_label: "LLM-as-Judge"
      description: "Rates how fluidly the agent adapts to compiler, analysis, and test errors."

reliability:
  cards:
    - tag: "Ceiling Metric"
      math_pill: "pass@k"
      title: "Capability"
      is_north_star: false
      description_parts:
        - text: "The probability that an agent succeeds "
        - em: "at least once"
        - text: " across "
        - strong: "k"
        - text: " attempts. Shows what the model can achieve under ideal sample runs."
    - tag: "Our North Star"
      tag_icon: "star"
      math_pill: "pass^k"
      title: "Consistency"
      is_north_star: true
      description_parts:
        - text: "The probability that an agent succeeds "
        - em: "every single time"
        - text: " across all "
        - strong: "k"
        - text: " attempts. Solves unreliability friction for real developer workflows."

score_triage:
  title: "Score Triage & Action Matrix"
  description: "Select a score range to view its criteria and immediate engineering triage actions."
  tiers:
    - id: "perfect"
      score: "1.00"
      name: "Perfect Success"
      heading: "Score 1.00 — Perfect Success"
      badge: "Criteria & Triage"
      criteria: "Code compiles, runs, and passes all unit and widget tests. Zero analyzer or DCM warnings. Idiomatic Dart 3 and flawless DX."
      actions_label: "Engineering Triage Actions:"
      actions:
        - label: "Telemetry check"
          detail: "Validate whether all expected tools were utilized."
        - label: "Skip optimization"
          detail: "If expected tools were skipped successfully, re-evaluate if the tool is redundant."
        - label: "Token burn review"
          detail: "If token consumption was high, optimize prompt context and create fast-path shortcut tools."
    - id: "functional"
      score: "0.75 – 0.99"
      name: "Minor Flaws"
      heading: "Score 0.75 – 0.99 — Minor Flaws"
      badge: "Criteria & Triage"
      criteria: "Code works and functional tests pass, but exhibits minor lint warnings, slightly unidiomatic patterns, or minor DX friction."
      actions_label: "Engineering Triage Actions:"
      actions:
        - label: "Prompt tuning"
          detail: "Tune skill prompt instructions for better Dart 3 style enforcement."
        - label: "Schema refinement"
          detail: "Refine tool parameter schemas and validation logic to prevent minor parameter retry hiccups."
        - label: "Model collaboration"
          detail: "Collaborate with model team to polish code generation formatting."
    - id: "partial"
      score: "0.50 – 0.74"
      name: "Partial Success"
      heading: "Score 0.50 – 0.74 — Partial Success"
      badge: "Criteria & Triage"
      criteria: "Core requirements work but some widget or unit tests fail, lint warnings are significant, or the agent entered noticeable recovery loops."
      actions_label: "Engineering Triage Actions:"
      actions:
        - label: "Assertion triage"
          detail: "Investigate specific test assertion failures."
        - label: "Context gap analysis"
          detail: "Analyze whether the agent lacked key framework or package context."
        - label: "Diagnostic feedback"
          detail: "Refine compiler diagnostic feedback to help the agent self-correct faster."
    - id: "poor"
      score: "0.25 – 0.49"
      name: "Poor Implementation"
      heading: "Score 0.25 – 0.49 — Poor Implementation"
      badge: "Criteria & Triage"
      criteria: "Fails to compile, ignores constraints, or encountered severe developer experience breakdown during execution."
      actions_label: "Engineering Triage Actions:"
      actions:
        - label: "Tool discoverability"
          detail: "If expected tools were ignored, fix tool discoverability, frontmatter, and prompt instructions."
        - label: "Tool output clarity"
          detail: "If tools were used but failed, improve helper tool output clarity and error messaging."
        - label: "Loop prevention"
          detail: "If token burn was high due to endless fix loops, improve compiler errors for single-step healing."
    - id: "failure"
      score: "0.00"
      name: "Total Failure"
      heading: "Score 0.00 — Total Failure"
      badge: "Criteria & Triage"
      criteria: "No working code produced, severe runtime crash, or agent caught in an infinite loop."
      actions_label: "Engineering Triage Actions:"
      actions:
        - label: "Human root-cause audit"
          detail: "Engineers inspect reasoning traces, plan adherence, and test harness logs."
        - label: "Behavior categorization"
          detail: "Identify premature surrender versus infinite loop traps."
        - label: "Constraint refinement"
          detail: "Update benchmark task prompt constraints and bounding parameters."
