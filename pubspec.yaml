name: flutter_websites
description: >-
  Pub workspace for Flutter websites and related tooling.
publish_to: none
environment:
  sdk: ^3.14.0-0

workspace:
  - packages/analysis_defaults
  - packages/dash_media_convert
  - packages/excerpter
  - packages/site_shared
  - packages/site_skills
  - sites/docs
  - sites/www
  - tool/dash_site

dev_dependencies:
  # Provides the shared agent skills installed to `.agents/skills/`.
  site_skills:
    path: packages/site_skills
